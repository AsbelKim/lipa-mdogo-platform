<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#16A39E" rx="6"/>

  <!-- Mobile phone icon in white -->
  <g transform="translate(8, 6)">
    <!-- Phone body -->
    <rect x="0" y="0" width="16" height="20" fill="none" stroke="white" stroke-width="1.5" rx="1.5"/>

    <!-- Screen -->
    <rect x="2" y="2" width="12" height="15" fill="white" rx="0.5" opacity="0.2"/>

    <!-- Notch -->
    <rect x="6" y="1.5" width="4" height="1" fill="white" opacity="0.5" rx="0.25"/>
  </g>

  <!-- Plus symbol for add/create -->
  <g transform="translate(18, 18)">
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#FF6B35" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
