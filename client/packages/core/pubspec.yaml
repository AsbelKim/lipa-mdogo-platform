name: core
description: Shared core package for Lipa Mdogo client (API client, models, auth)
publish_to: none

version: 1.0.0

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.3.0
  retrofit: ^4.1.0
  json_serializable: ^6.7.0

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Utilities
  freezed_annotation: ^2.4.0
  equatable: ^2.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  retrofit_generator: ^8.1.0
