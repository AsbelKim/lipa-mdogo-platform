name: lipa_mdogo_client
description: Multi-platform client for Lipa Mdogo platform (admin dashboard + sales agent app)
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared core package
  core:
    path: packages/core

  # UI & Navigation
  get: ^4.6.0
  flutter_adaptive_scaffold: ^0.2.0

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # API & HTTP
  dio: ^5.3.0
  retrofit: ^4.1.0
  json_serializable: ^6.7.0

  # Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Utilities
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  equatable: ^2.0.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
